
name: integration

on:
  push: {branches: [main]} # pushes to main
  pull_request: {} # all PRs
  schedule: [cron: '0 12 * * 3'] # every Wednesday at noon

jobs:
  vaswani-bm25:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      runtag: ubuntu-latest-3.12

    steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Install Python 3.12
       uses: actions/setup-python@v5
       with:
         python-version: '3.12'

     - name: Cache Dependencies
       uses: actions/cache@v4
       with:
         path: ${{ env.pythonLocation }}
         key: integration-${{ env.runtag }}-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}

     - name: Install Dependencies
       run: |
         pip install --upgrade -r requirements.txt -r requirements-dev.txt
         pip install --upgrade pyterrier_pisa
         pip install -e .

     - name: Check Retriever Is Installed
       # The test skips itself without PISA; fail loudly here instead, so a
       # broken install can never show up as a passing gate.
       run: python -c 'import pyterrier_pisa'

     - name: Cache Datasets
       uses: actions/cache@v4
       with:
         path: ~/.ir_datasets
         key: ir-datasets-vaswani

     - name: End-to-End Test
       run: |
         pytest -m e2e --durations=10 -p no:faulthandler tests/e2e/
